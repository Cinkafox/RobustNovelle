- type: scene
  id: default
  dialogs:
    - title: "Тестовая среда"
      location: lustoeb_room
    - character: dictor
    - text: "!{1000}...{100} а че дальше?"
      choices:
        Продолжить:
          - text: Продолжим ага
        Задуматься:
          - text: стоп, а нахрена мне это?
          - text: я пока подумаю...
          - stopDialog: true
    - set: "#meowCount = 1"
    - scene: testSceneLoop

- type: scene
  id: testSceneLoop
  dialogs:
    - text: "{30}Вы {100}очень {30}хотите мяукать{100}..."
    - text: "> Сопротивлятся?"
      choices:
        Нет!:
          - text: "!{300}М...{100}мяу!"
        Черт, парень. Да!:
          - scene: testSceneEnd
    - if: "$(#meowCount >= 5)"
      then:
        - text: "Вы сорвали голос..."
        - scene: testSceneEnd
    - text: "Вы мяукнули $(#meowCount = #meowCount + 1) раз"
    - scene: testSceneLoop
          
- type: scene
  id: testSceneEnd
  dialogs:
    - text: "Все! Хватит мяукать!"
    - action: !type:EndGameAction
