- type: scene
  id: default
  dialogs:
    - title: "Тестовая среда"
      location: lustoeb_room
    - character: dictor
    - text: "AAAAAAAAAAAAAAAAAAAAAAAAbBBBb"  
    - text: .. а че дальше?
      choices:
        Продолжить:
          - text: Продолжим ага
        Задуматься:
          - text: стоп, а нахрена мне это?
          - text: я пока подумаю...
          - stopDialog: true
    - variable:
        name: meowCount
        value: 0
    - scene: testSceneLoop

- type: scene
  id: testSceneLoop
  dialogs:
    - text: "Вы очень хотите мяукать?"
    - text: "Сопротивлятся?"
      choices:
        Нет!:
          - text: М...мяу!
        Черт, парень. Да!:
          - scene: testSceneEnd
    - if: "$(#meowCount >= 5)"
      then:
        - text: "Вы сорвали голос..."
        - scene: testSceneEnd
    - text: "Вы мяукнули $(#meowCount = #meowCount + 1) раз"
    - scene: testSceneLoop
          
- type: scene
  id: testSceneEnd
  dialogs:
    - text: "Все! Хватит мяукать!"
    - action: !type:EndGameAction
